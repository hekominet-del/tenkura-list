<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>山の天気まとめ</title>
<style>
  :root{
    --bg:#0b1220; --card:#151f31; --card2:#1c2a41; --line:#26364f;
    --fg:#e8eef8; --muted:#8fa3bd;
    --A:#22c55e; --B:#f59e0b; --C:#ef4444;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif;}
  body{padding-bottom:24px;}
  header{position:sticky;top:0;z-index:20;background:rgba(11,18,32,.94);
    backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
    padding:calc(10px + env(safe-area-inset-top)) 14px 8px;}
  .hrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
  h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.02em}
  h1 span{color:var(--muted);font-weight:500;font-size:11px;margin-left:6px}
  .btn{border:1px solid var(--line);background:var(--card);color:var(--fg);
    border-radius:10px;padding:6px 10px;font-size:12px;display:flex;align-items:center;gap:4px}
  .btn:active{background:var(--card2)}
  .meta{font-size:11px;color:var(--muted);margin-top:6px;display:flex;gap:10px;flex-wrap:wrap}
  .legend{display:flex;align-items:center;gap:10px;font-size:11px;color:var(--muted);margin-top:6px;flex-wrap:wrap;row-gap:3px}
  .legend span{display:inline-flex;align-items:center;gap:3px}
  .legend img{height:auto;width:24px;display:block}
  .legend .note{margin-left:auto;font-size:9px;line-height:1.3;text-align:right;letter-spacing:-.02em}
  .quick{display:flex;gap:8px;margin-top:9px}
  .ql{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;
    background:var(--card);border:1px solid var(--line);color:var(--fg);
    border-radius:12px;padding:9px 8px;font-size:13px;font-weight:700;line-height:1.2;white-space:nowrap}
  .ql:active{transform:scale(.98)}
  .ql svg{flex:0 0 auto;width:16px;height:16px}
  .ql-primary{background:#1d4ed8;border-color:#3b82f6;color:#fff;
    box-shadow:0 2px 10px rgba(37,99,235,.35);font-size:13.5px}
  .ql-primary svg{width:18px;height:18px}

  .wrap{padding:10px 10px 0;overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{border-collapse:separate;border-spacing:0;width:100%;table-layout:fixed;max-width:560px}
  /* 上段＝今日/明日（6・9・12・15時）、下段＝明後日以降。両方ともスマホ幅に収める */
  #tblTop{min-width:336px}
  #tblBot{min-width:340px}
  thead th{background:var(--bg);font-weight:600;font-size:9.5px;
    color:var(--muted);padding:3px 0;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
  #tblTop thead th{position:sticky;top:0;z-index:7}
  thead th.name{text-align:left;padding-left:5px;position:sticky;left:0;z-index:6;background:var(--bg);width:88px}
  thead th.dw{width:124px}
  thead th.dn{width:42px}
  thead th.today{color:#93c5fd}
  thead .hd{display:block;font-weight:400;font-size:8.5px}
  thead .ticks{display:flex;justify-content:center;gap:4px;margin-top:1px}
  thead .ticks i{width:28px;text-align:center;font-style:normal;font-size:8px;color:#7f96b3;font-weight:700}
  tbody td{border-bottom:1px solid rgba(38,54,79,.6);padding:5px 0;text-align:center;vertical-align:top}
  td.name{text-align:left;position:sticky;left:0;background:var(--bg);z-index:5;
    padding:7px 4px 7px 2px;border-right:1px solid var(--line);width:88px;max-width:88px}
  .mname{font-size:11px;font-weight:700;line-height:1.2;display:-webkit-box;
    -webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:84px;
    color:var(--fg);text-decoration:underline;
    text-decoration-color:rgba(147,197,253,.45);text-decoration-thickness:1px;text-underline-offset:2px}
  .msub{font-size:9px;color:var(--muted);display:block;margin-top:1px}
  .flink{display:block;margin-top:2px;font-size:9px;line-height:1.25;color:#93c5fd;
    text-decoration:none;white-space:nowrap;width:max-content;
    border-bottom:1px solid rgba(147,197,253,.5)}
  td.cell a{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
    gap:2px;text-decoration:none;color:inherit}
  td.cell a:active{opacity:.6}
  .badge{display:inline-flex;align-items:center;justify-content:center;width:28px;height:25px}
  .badge img{width:28px;height:auto;display:block}
  .bN{background:#2b3a52;color:var(--muted);font-size:11px;border-radius:7px;width:26px;height:25px}
  .tmp{display:block;font-size:9px;color:var(--muted);margin-top:2px;line-height:1}
  /* 今日・明日：6/9/12/15時の4マークを1列に。時刻は表の見出しに同じ幅で並べる（.hr と .ticks i を同じ28pxに） */
  .hrs{display:flex;justify-content:center;gap:4px}
  .hr{width:28px;display:flex;justify-content:center}
  tr.err td{color:var(--C);font-size:11px}

  .empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:13px;line-height:1.7}
  footer{text-align:center;font-size:10px;color:var(--muted);padding:14px 20px 4px;line-height:1.7}
  .spin{padding:34px;text-align:center;color:var(--muted);font-size:12.5px}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <h1>山の天気まとめ<span>tenkura</span></h1>
    <div style="display:flex;gap:6px">
      <button class="btn" id="sortBtn">指数順</button>
      <button class="btn" id="reloadBtn">更新</button>
    </div>
  </div>
  <div class="meta"><span id="updated">—</span><span id="srcnote">データ元: てんきとくらす（登山指数A〜C）</span></div>
  <div class="quick">
    <a class="ql ql-primary" href="https://weathernews.jp/onebox/radar/" target="_blank" rel="noopener"
       title="ウェザーニュース 雨雲レーダー（60時間予想）">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M17.5 14.5a4.5 4.5 0 0 0-.9-8.9 6 6 0 0 0-11.4 1.7A4 4 0 0 0 6.2 14.5"/>
        <path d="M8 18.5l-1 2.5M12.2 18.5l-1 2.5M16.4 18.5l-1 2.5"/>
      </svg><span>雨雲レーダー</span></a>
    <a class="ql" href="https://www.windy.com/?36.5,137.8,7" target="_blank" rel="noopener"
       title="Windy: 風・雨・積雪の予想マップ">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 8h10a3 3 0 1 0-3-3"/><path d="M3 12h14a3 3 0 1 1-3 3"/>
        <path d="M3 16h7a2.5 2.5 0 1 1-2.5 2.5"/>
      </svg><span>風・積雪</span></a>
  </div>
  <div class="legend">
    <span><img src="img/mnt1.gif" alt="A適">適</span>
    <span><img src="img/mnt2.gif" alt="Bやや不適">やや不適</span>
    <span><img src="img/mnt3.gif" alt="C不適">不適</span>
    <span class="note">今日・明日＝左から6・9・12・15時<br>明後日以降＝日中(6-15時)の最悪値</span>
  </div>
</header>

<div class="wrap">
  <table id="tblTop">
    <thead><tr id="headTop"></tr></thead>
    <tbody id="bodyTop"><tr><td class="spin">読み込み中…</td></tr></tbody>
  </table>
</div>
<div class="wrap">
  <table id="tblBot">
    <thead><tr id="headBot"></tr></thead>
    <tbody id="bodyBot"></tbody>
  </table>
</div>
<footer>
  山名・指数マークをタップすると、てんきとくらすの今日の天気が開きます。<br>
  登山指数は山頂付近の気象から算出された目安です。実際の天候とは異なる場合があります。<br>
  数値はてんきとくらすのページから取得しています（1日5回・自動更新）。
</footer>

<script>
// 1ページ完結のアプリ。詳細シート・山の追加シートは廃止した。
const $ = id => document.getElementById(id);
const RANK = {A:3,B:2,C:1};
const ICON = {A:'img/mnt1.gif', B:'img/mnt2.gif', C:'img/mnt3.gif'};
// 今日・明日に出す時刻＝6・9・12・15時（山行の行動時間帯）。てんきとくらすの時間別表の見出しと同じ "06" 形式
const HOURS = [['06','6'],['09','9'],['12','12'],['15','15']];

// てんきとくらすの山ページの「今日の天気」へ直行する。
// 表の id（temp-d）はスマホ版ページでは非表示のPC用テーブル側に付くため効かない。
// 見出しの文字を指すテキストフラグメント（#:~:text=）なら PC版/スマホ版どちらでも着地する。
const TENKURA_BASE = 'https://tenkura.n-kishou.co.jp/tk/kanko/kad.html';
const TODAY_ANCHOR = '#:~:text=' + encodeURIComponent('登山指数と上空の気温・風');
const tenkuraUrl = m => `${TENKURA_BASE}?code=${m.code}&type=15&ba=${m.ba||'hr'}${TODAY_ANCHOR}`;
// 麓の市町村 → 気象庁の市町村予報（jma は class20s のエリアコード）
const jmaUrl = m => `https://www.jma.go.jp/bosai/forecast/#area_type=class20s&area_code=${m.jma}`;

let data = null;
let sortByIndex = false;

const fmtT = iso => { const d = new Date(iso); return d.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'}); };

function badge(idx){
  if(!idx || !ICON[idx]) return '<span class="badge bN">−</span>';
  return `<span class="badge"><img src="${ICON[idx]}" alt="${idx}指数" loading="lazy"></span>`;
}
function tempLabel(v){
  if(v===null||v===undefined) return '';
  return `${Math.round(v)}°`;
}

function columns(){
  if(!data) return [];
  const seen = new Set(); const cols = [];
  for(const m of data.mountains){
    for(const d of (m.days||[])){
      if(!seen.has(d.date)){ seen.add(d.date); cols.push(d.date); }
    }
  }
  // どの山も指数・気温が未発表の日（先の予報枠）は列ごと落とす
  const useful = cols.filter(c => (data.mountains||[]).some(m=>{
    const d = (m.days||[]).find(x=>x.date===c);
    return d && (d.index || d.temp_max!==null && d.temp_max!==undefined);
  }));
  return (useful.length ? useful : cols).slice(0,8);
}

const LABELS = ['今日','明日','明後日','3日後','4日後','5日後','6日後','7日後'];
const cleanDate = c => c.replace(/\(.\)/,'');

// 山名セル（上段・下段で同じものを使う）
function nameCell(m, url){
  const alt = m.altitude ? `${m.altitude}m` : '';
  const fh = m.jma
    ? `<a class="flink" href="${jmaUrl(m)}" target="_blank" rel="noopener"
         title="気象庁 天気予報（麓の${m.municipality||'市町村'}）">麓の天気 ↗</a>` : '';
  return `<td class="name"><a class="mname" href="${url}" target="_blank" rel="noopener"
    title="てんきとくらすで今日の天気を見る">${m.name||m.code}</a><span class="msub">${alt}${m.error?' 取得失敗':''}</span>${fh}</td>`;
}
function tempText(d){
  if(d.temp_max!==null && d.temp_min!==null && d.temp_max!==d.temp_min)
    return `${Math.round(d.temp_max)}/${Math.round(d.temp_min)}`;
  return tempLabel(d.temp_max);
}
// 上段（今日・明日）：6・9・12・15時の4マーク。時刻は見出し側の目盛りに並ぶ。
// 夕方以降はてんきとくらすが過ぎた時間を落とすので、4つとも無い日は従来どおり1マークに戻す。
function hourCell(m, c, d, url){
  const hrs = d.hours || {};
  const inner = HOURS.some(([h])=>hrs[h])
    ? '<span class="hrs">' + HOURS.map(([h]) =>
        `<span class="hr" title="${m.name||m.code} ${c} ${+h}時${hrs[h]?'':'（発表なし）'}">${badge(hrs[h])}</span>`
      ).join('') + '</span>'
    : badge(d.index);
  return `<td class="cell"><a href="${url}" target="_blank" rel="noopener"
    title="てんきとくらす：${m.name||m.code}の${c}の天気">${inner}<span class="tmp">${tempText(d)}</span></a></td>`;
}
// 下段（明後日以降）：週間予報の1マーク＝日中6-15時の最悪値
function dayCell(m, c, d, url){
  return `<td class="cell"><a href="${url}" target="_blank" rel="noopener"
    title="てんきとくらす：${m.name||m.code}の${c}の天気">${badge(d.index)}<span class="tmp">${tempText(d)}</span></a></td>`;
}

function render(){
  const cols = columns();
  const top = cols.slice(0,2), bot = cols.slice(2);

  // 上段の見出し：今日/明日＋時刻の目盛り（アイコンと同じ28px幅で並べる）
  const hasHours = c => (data.mountains||[]).some(m=>{
    const d = (m.days||[]).find(x=>x.date===c);
    return d && HOURS.some(([h])=>(d.hours||{})[h]);
  });
  $('headTop').innerHTML = '<th class="name">山</th>' + top.map((c,i)=>
    `<th class="dw${i===0?' today':''}">${LABELS[i]}<span class="hd">${cleanDate(c)}</span>${
      hasHours(c) ? '<span class="ticks">' + HOURS.map(([,lbl])=>`<i>${lbl}</i>`).join('') + '</span>' : ''
    }</th>`
  ).join('');
  // 下段の見出し：明後日以降
  $('headBot').innerHTML = '<th class="name">山</th>' + bot.map((c,i)=>
    `<th class="dn">${LABELS[i+2]||''}<span class="hd">${cleanDate(c)}</span></th>`
  ).join('');

  let ms = (data?.mountains || []).slice();
  if(sortByIndex){
    ms.sort((a,b)=>{
      const ai = a.days?.[0]?.index, bi = b.days?.[0]?.index;
      return (RANK[bi]||0) - (RANK[ai]||0);
    });
  }
  if(!ms.length){
    $('bodyTop').innerHTML = '<tr><td colspan="3" class="empty">データがありません。「更新」を押してください。</td></tr>';
    $('bodyBot').innerHTML = '<tr><td colspan="7" class="empty">—</td></tr>';
    return;
  }
  const byDateOf = m => { const o = {}; (m.days||[]).forEach(d=>{ o[d.date] = d }); return o; };

  $('bodyTop').innerHTML = ms.map(m=>{
    const by = byDateOf(m), url = tenkuraUrl(m);
    const cells = top.map(c=>{
      const d = by[c];
      if(m.error || !d) return '<td>—</td>';
      return hourCell(m, c, d, url);
    }).join('');
    return `<tr class="${m.error?'err':''}">${nameCell(m,url)}${cells}</tr>`;
  }).join('');

  $('bodyBot').innerHTML = ms.map(m=>{
    const by = byDateOf(m), url = tenkuraUrl(m);
    const cells = bot.map(c=>{
      const d = by[c];
      if(m.error || !d) return '<td>—</td>';
      return dayCell(m, c, d, url);
    }).join('');
    return `<tr class="${m.error?'err':''}">${nameCell(m,url)}${cells}</tr>`;
  }).join('');
}

async function fetchData(){
  $('bodyTop').innerHTML = '<tr><td class="spin">読み込み中…</td></tr>';
  $('bodyBot').innerHTML = '';
  try{
    // 静的版: 生成済みの data.json を読む（サーバー不要）
    const r = await fetch('data.json?t='+Date.now(), {cache:'no-store'});
    data = await r.json();
    $('updated').textContent = '更新 ' + fmtT(data.at);
    render();
  }catch(e){
    $('bodyTop').innerHTML = `<tr><td class="spin">読み込み失敗: ${e}</td></tr>`;
  }
}

$('reloadBtn').onclick = () => fetchData();
$('sortBtn').onclick = ()=>{ sortByIndex=!sortByIndex; $('sortBtn').textContent = sortByIndex?'指数順 ✓':'指数順'; render(); };

(async ()=>{ await fetchData(); setInterval(fetchData, 10*60*1000); })();

// PWA: service worker（オフラインでも最後のデータを表示）
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
</body>
</html>
